name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/app

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

compose-config:
  name: Compose configuration
  runs-on: ubuntu-latest
  steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Validate base Compose file
      run: docker compose -f compose.yaml config
    - name: Validate optional Docker integration
      run: docker compose -f compose.yaml -f compose.docker.yaml config
    - name: Validate local-build override
      run: docker compose -f compose.yaml -f compose.build.yaml config

container-build:
  name: Production container build
  runs-on: ubuntu-latest
  steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build all-in-one production image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        tags: homelab-dashboard:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
