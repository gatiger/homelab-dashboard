name: Feature request
description: Suggest a feature, service template, or integration
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Related service (optional)
      placeholder: Plex, Proxmox, Home Assistant, etc.
