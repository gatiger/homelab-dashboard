name: homelab-dashboard

services:
  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/gatiger/homelab-dashboard}:${DASHBOARD_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    environment:
      APP_NAME: ${APP_NAME:-Homelab Dashboard}
      SESSION_HOURS: ${SESSION_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STATUS_TIMEOUT: ${STATUS_TIMEOUT:-4}
      STATUS_WORKERS: ${STATUS_WORKERS:-8}
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL:-}
      UPDATE_JOB_TIMEOUT: ${UPDATE_JOB_TIMEOUT:-900}
      UPDATE_CHECK_INTERVAL_HOURS: ${UPDATE_CHECK_INTERVAL_HOURS:-12}
      EXTENSION_REGISTRY_URL: ${EXTENSION_REGISTRY_URL:-https://raw.githubusercontent.com/gatiger/homelab-dashboard/main/registry/index.json}
      EXTENSION_REGISTRY_TIMEOUT: ${EXTENSION_REGISTRY_TIMEOUT:-8}
      EXTENSION_REGISTRY_CACHE_SECONDS: ${EXTENSION_REGISTRY_CACHE_SECONDS:-300}
    volumes:
      - dashboard-data:/app/data

volumes:
  dashboard-data:
    name: ${DASHBOARD_DATA_VOLUME:-homelab-dashboard-data}
